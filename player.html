<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MP3 Stream Player</title>
</head>
<body>
    <h1>MP3 Stream Player</h1>
    <audio id="audioPlayer" controls>
        <source src="http://localhost:5001/stream" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <br>
    <button id="replayBtn">Replay Sample From Here</button>
    <script>
        document.getElementById('replayBtn').onclick = function() {
            fetch('/replay', { method: 'POST' })
                .then(response => {
                    if (!response.ok) throw new Error('Replay failed');
                });
        };
    </script>
</body>
</html>
