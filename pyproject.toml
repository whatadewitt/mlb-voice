[project]
name = "mlb-voice"
version = "0.2.0"
description = "MLB Voice 2026 — TTS + HLS service"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0",
  "pydub>=0.25",
  "soundfile>=0.12",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "openai>=1.50",
  "pybaseball>=2.2",
]

[project.optional-dependencies]
dia2 = []  # CUDA-only. Install on the RunPod host: `uv pip install "dia2 @ git+https://github.com/nari-labs/dia2"`. Note: upstream pyproject pins `packages = ["dia2"]` (no recursion), which drops the dia2.core / dia2.audio / dia2.runtime subpackages from the wheel — you must clone the repo, replace that line with a `[tool.setuptools.packages.find]` block, then `uv pip install --force-reinstall <local-path>`. Don't try Mac: dia2 has no MPS/CPU path.
dev = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
