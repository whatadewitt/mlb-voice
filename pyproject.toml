[project]
name = "mlb-voice"
version = "0.2.0"
description = "MLB Voice 2026 — TTS + HLS service"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0",
  "pydub>=0.25",
  "soundfile>=0.12",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "openai>=1.50",
  "pybaseball>=2.2",
]

[project.optional-dependencies]
dia2 = []  # install separately on CUDA host: `uv pip install "dia2 @ git+https://github.com/nari-labs/dia2"`
dev = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
